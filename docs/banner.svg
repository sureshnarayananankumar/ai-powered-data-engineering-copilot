<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="AI-Powered Data Engineering Copilot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#06b6d4" stop-opacity=".45"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#db2777" stop-opacity=".35"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="160" cy="40" r="240" fill="url(#b1)"><animate attributeName="cx" values="160;260;160" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="240" r="260" fill="url(#b2)"><animate attributeName="cy" values="240;160;240" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="330" r="200" fill="url(#b3)"/>

  <!-- agent network -->
  <g stroke="#818cf8" stroke-opacity=".35" stroke-width="1.5" fill="none">
    <path d="M930 150 L1010 80 M930 150 L1040 130 M930 150 L1040 180 M930 150 L1010 225 M930 150 L860 225"/>
  </g>
  <g font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif" font-size="20" text-anchor="middle">
    <circle cx="930" cy="150" r="30" fill="#8b5cf6"><animate attributeName="r" values="30;34;30" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="930" y="158">🧭</text>
    <g fill="#141633" stroke="#818cf8" stroke-width="1.5">
      <circle cx="1010" cy="80" r="22"/><circle cx="1040" cy="130" r="22"/><circle cx="1040" cy="180" r="22"/><circle cx="1010" cy="225" r="22"/><circle cx="860" cy="225" r="22"/>
    </g>
    <text x="1010" y="87">🧮</text><text x="1040" y="137">📚</text><text x="1040" y="187">🧬</text><text x="1010" y="232">🧪</text><text x="860" y="232">🛠️</text>
    <circle r="4" fill="#22d3ee"><animateMotion dur="2.2s" repeatCount="indefinite" path="M930 150 L1010 80"/></circle>
    <circle r="4" fill="#22d3ee"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite" path="M930 150 L1040 180"/></circle>
    <circle r="4" fill="#f472b6"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite" path="M930 150 L860 225"/></circle>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="88" fill="#c4b5fd" font-size="16" font-weight="600" letter-spacing="3">AGENTIC GENAI · LANGGRAPH · ANGULAR</text>
    <text x="64" y="146" fill="url(#g)" font-size="46" font-weight="800">AI-Powered Data Engineering</text>
    <text x="64" y="198" fill="#ffffff" font-size="46" font-weight="800">Copilot</text>
    <text x="64" y="244" fill="#a5adcf" font-size="18">Snowflake SQL · dbt lineage · data quality · RAG docs · Airflow incidents — with guardrails</text>
  </g>
</svg>
